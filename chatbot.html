<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Assistant</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0a0a0f;
    --surface: #13131a;
    --surface2: #1c1c26;
    --border: rgba(255,255,255,0.07);
    --accent: #7c6cfa;
    --accent2: #a78bfa;
    --text: #f0f0f5;
    --muted: #7b7b90;
    --user-bg: #7c6cfa;
    --bot-bg: #1c1c26;
    --radius: 18px;
    --radius-sm: 10px;
  }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* Ambient background */
  body::before {
    content: '';
    position: fixed;
    top: -200px;
    left: -200px;
    width: 600px;
    height: 600px;
    background: radial-gradient(circle, rgba(124,108,250,0.08) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }

  body::after {
    content: '';
    position: fixed;
    bottom: -200px;
    right: -200px;
    width: 500px;
    height: 500px;
    background: radial-gradient(circle, rgba(167,139,250,0.05) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }

  /* Header */
  .header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 16px 24px;
    border-bottom: 1px solid var(--border);
    background: rgba(10,10,15,0.95);
    backdrop-filter: blur(20px);
    position: relative;
    z-index: 10;
  }

  .avatar {
    width: 40px;
    height: 40px;
    border-radius: 12px;
    background: linear-gradient(135deg, #7c6cfa, #a78bfa);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .avatar svg { width: 20px; height: 20px; fill: white; }

  .header-info { flex: 1; }

  .bot-name {
    font-family: 'Syne', sans-serif;
    font-weight: 600;
    font-size: 15px;
    color: var(--text);
    letter-spacing: -0.01em;
  }

  .status {
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 12px;
    color: var(--muted);
    margin-top: 2px;
  }

  .status-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #4ade80;
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  .powered {
    font-size: 11px;
    color: var(--muted);
    font-family: 'DM Sans', sans-serif;
    font-weight: 300;
  }

  /* Messages */
  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    position: relative;
    z-index: 1;
    scroll-behavior: smooth;
  }

  .messages::-webkit-scrollbar { width: 4px; }
  .messages::-webkit-scrollbar-track { background: transparent; }
  .messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

  .message {
    display: flex;
    align-items: flex-end;
    gap: 8px;
    animation: fadeUp 0.3s ease;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .message.user { flex-direction: row-reverse; }

  .msg-avatar {
    width: 28px;
    height: 28px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: 600;
    flex-shrink: 0;
    font-family: 'Syne', sans-serif;
  }

  .bot .msg-avatar {
    background: linear-gradient(135deg, #7c6cfa, #a78bfa);
    color: white;
  }

  .user .msg-avatar {
    background: var(--surface2);
    color: var(--muted);
    border: 1px solid var(--border);
  }

  .bubble {
    max-width: 72%;
    padding: 12px 16px;
    border-radius: var(--radius);
    font-size: 14.5px;
    line-height: 1.65;
    position: relative;
  }

  .bot .bubble {
    background: var(--bot-bg);
    border: 1px solid var(--border);
    border-bottom-left-radius: 4px;
    color: var(--text);
  }

  .user .bubble {
    background: var(--user-bg);
    border-bottom-right-radius: 4px;
    color: white;
  }

  .bubble-time {
    font-size: 10px;
    color: var(--muted);
    margin-top: 4px;
    padding: 0 4px;
  }

  .message.user .bubble-time { text-align: right; }

  /* Typing indicator */
  .typing .bubble {
    padding: 14px 18px;
  }

  .typing-dots {
    display: flex;
    gap: 4px;
    align-items: center;
  }

  .typing-dots span {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--accent2);
    animation: bounce 1.2s infinite;
  }

  .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
  .typing-dots span:nth-child(3) { animation-delay: 0.4s; }

  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
    30% { transform: translateY(-6px); opacity: 1; }
  }

  /* Welcome */
  .welcome {
    text-align: center;
    padding: 40px 20px;
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
  }

  .welcome-icon {
    width: 64px;
    height: 64px;
    border-radius: 20px;
    background: linear-gradient(135deg, rgba(124,108,250,0.2), rgba(167,139,250,0.1));
    border: 1px solid rgba(124,108,250,0.3);
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 8px;
  }

  .welcome-icon svg { width: 30px; height: 30px; fill: var(--accent2); }

  .welcome h2 {
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    font-size: 22px;
    color: var(--text);
    letter-spacing: -0.02em;
  }

  .welcome p {
    font-size: 14px;
    color: var(--muted);
    max-width: 280px;
    line-height: 1.6;
  }

  .suggestions {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
    margin-top: 8px;
  }

  .suggestion {
    padding: 8px 14px;
    border: 1px solid var(--border);
    border-radius: 20px;
    font-size: 12.5px;
    color: var(--muted);
    cursor: pointer;
    background: var(--surface);
    transition: all 0.2s;
    font-family: 'DM Sans', sans-serif;
  }

  .suggestion:hover {
    border-color: var(--accent);
    color: var(--accent2);
    background: rgba(124,108,250,0.08);
  }

  /* Input */
  .input-area {
    padding: 16px 24px 20px;
    border-top: 1px solid var(--border);
    background: rgba(10,10,15,0.95);
    backdrop-filter: blur(20px);
    position: relative;
    z-index: 10;
  }

  .input-row {
    display: flex;
    align-items: flex-end;
    gap: 10px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 10px 10px 10px 16px;
    transition: border-color 0.2s;
  }

  .input-row:focus-within {
    border-color: rgba(124,108,250,0.5);
  }

  textarea {
    flex: 1;
    background: none;
    border: none;
    outline: none;
    font-family: 'DM Sans', sans-serif;
    font-size: 14.5px;
    color: var(--text);
    resize: none;
    max-height: 120px;
    line-height: 1.5;
    padding: 2px 0;
  }

  textarea::placeholder { color: var(--muted); }

  .send-btn {
    width: 36px;
    height: 36px;
    border-radius: 10px;
    background: var(--accent);
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: all 0.2s;
  }

  .send-btn:hover { background: var(--accent2); transform: scale(1.05); }
  .send-btn:active { transform: scale(0.97); }
  .send-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
  .send-btn svg { width: 16px; height: 16px; fill: white; }

  .footer-note {
    text-align: center;
    font-size: 11px;
    color: var(--muted);
    margin-top: 8px;
    font-weight: 300;
  }

  /* Config panel */
  .config-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: center;
    animation: fadeIn 0.2s ease;
  }

  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  .config-panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 28px;
    width: min(440px, 90vw);
    animation: slideUp 0.3s ease;
  }

  @keyframes slideUp {
    from { transform: translateY(20px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }

  .config-panel h3 {
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    font-size: 18px;
    margin-bottom: 20px;
    color: var(--text);
    letter-spacing: -0.02em;
  }

  .field { margin-bottom: 16px; }

  .field label {
    display: block;
    font-size: 12px;
    font-weight: 500;
    color: var(--muted);
    margin-bottom: 6px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }

  .field input, .field textarea, .field select {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 10px 14px;
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    color: var(--text);
    outline: none;
    transition: border-color 0.2s;
  }

  .field textarea { resize: vertical; min-height: 90px; line-height: 1.5; }

  .field input:focus, .field textarea:focus, .field select:focus {
    border-color: rgba(124,108,250,0.5);
  }

  .field select option { background: var(--surface2); }

  .config-btns {
    display: flex;
    gap: 10px;
    margin-top: 20px;
  }

  .btn-primary {
    flex: 1;
    padding: 11px;
    background: var(--accent);
    border: none;
    border-radius: var(--radius-sm);
    color: white;
    font-family: 'Syne', sans-serif;
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
    transition: all 0.2s;
  }

  .btn-primary:hover { background: var(--accent2); }

  .btn-ghost {
    padding: 11px 20px;
    background: transparent;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--muted);
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    cursor: pointer;
    transition: all 0.2s;
  }

  .btn-ghost:hover { border-color: var(--muted); color: var(--text); }

  .settings-btn {
    width: 36px;
    height: 36px;
    border-radius: 10px;
    background: var(--surface2);
    border: 1px solid var(--border);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
    margin-left: auto;
  }

  .settings-btn:hover { border-color: var(--accent); }
  .settings-btn svg { width: 16px; height: 16px; stroke: var(--muted); fill: none; }

  .error-msg {
    background: rgba(239,68,68,0.1);
    border: 1px solid rgba(239,68,68,0.3);
    border-radius: var(--radius-sm);
    padding: 10px 14px;
    font-size: 13px;
    color: #f87171;
    margin-top: 8px;
  }
</style>
</head>
<body>

<!-- Config overlay (shown on first load) -->
<div class="config-overlay" id="configOverlay">
  <div class="config-panel">
    <h3>Setup your chatbot</h3>

    <div class="field">
      <label>OpenRouter API Key</label>
      <input type="password" id="apiKeyInput" placeholder="sk-or-v1-..." />
    </div>

    <div class="field">
      <label>Bot Name</label>
      <input type="text" id="botNameInput" placeholder="e.g. Aria, Max, Support Bot" value="Aria" />
    </div>

    <div class="field">
      <label>AI Model (free models)</label>
      <select id="modelInput">
        <option value="meta-llama/llama-3.3-70b-instruct:free">Llama 3.3 70B (Best Free)</option>
        <option value="mistralai/mistral-7b-instruct:free">Mistral 7B</option>
        <option value="google/gemma-3-27b-it:free">Google Gemma 3 27B</option>
        <option value="qwen/qwen3-8b:free">Qwen 3 8B</option>
        <option value="deepseek/deepseek-r1:free">DeepSeek R1</option>
      </select>
    </div>

    <div class="field">
      <label>System Prompt (tell the bot who it is)</label>
      <textarea id="systemInput">You are Aria, a helpful and friendly AI assistant for a business. Answer customer questions clearly and professionally. Keep responses concise and helpful.</textarea>
    </div>

    <div id="configError" style="display:none" class="error-msg"></div>

    <div class="config-btns">
      <button class="btn-ghost" id="skipBtn">Use demo</button>
      <button class="btn-primary" id="saveConfigBtn">Start chatting →</button>
    </div>
  </div>
</div>

<!-- Main chat UI -->
<div class="header">
  <div class="avatar">
    <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 14.5v-9l6 4.5-6 4.5z"/></svg>
  </div>
  <div class="header-info">
    <div class="bot-name" id="headerBotName">Aria</div>
    <div class="status">
      <div class="status-dot"></div>
      Online — ready to help
    </div>
  </div>
  <span class="powered">Powered by OpenRouter</span>
  <button class="settings-btn" id="openConfigBtn" title="Settings">
    <svg viewBox="0 0 24 24" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/>
    </svg>
  </button>
</div>

<div class="messages" id="messages">
  <div class="welcome" id="welcome">
    <div class="welcome-icon">
      <svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-2 12H6v-2h12v2zm0-3H6V9h12v2zm0-3H6V6h12v2z"/></svg>
    </div>
    <h2 id="welcomeTitle">Hi, I'm Aria</h2>
    <p id="welcomeDesc">Your AI assistant. Ask me anything — I'm here to help you 24/7.</p>
    <div class="suggestions">
      <div class="suggestion" onclick="sendSuggestion(this)">What can you help me with?</div>
      <div class="suggestion" onclick="sendSuggestion(this)">Tell me about your services</div>
      <div class="suggestion" onclick="sendSuggestion(this)">How does this work?</div>
    </div>
  </div>
</div>

<div class="input-area">
  <div class="input-row">
    <textarea id="userInput" placeholder="Type a message..." rows="1" maxlength="2000"></textarea>
    <button class="send-btn" id="sendBtn" disabled>
      <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
    </button>
  </div>
  <div class="footer-note">AI can make mistakes. Verify important information.</div>
</div>

<script>
let config = {
  apiKey: '',
  botName: 'Aria',
  model: 'meta-llama/llama-3.3-70b-instruct:free',
  system: 'You are Aria, a helpful and friendly AI assistant. Answer questions clearly and professionally.'
};
let history = [];
let isLoading = false;

const messagesEl = document.getElementById('messages');
const userInput = document.getElementById('userInput');
const sendBtn = document.getElementById('sendBtn');
const welcome = document.getElementById('welcome');

function getTime() {
  return new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
}

function addMessage(role, text) {
  if (welcome) welcome.style.display = 'none';
  const div = document.createElement('div');
  div.className = `message ${role}`;
  const initials = role === 'bot' ? config.botName.slice(0,2).toUpperCase() : 'You';
  div.innerHTML = `
    <div class="msg-avatar">${initials.slice(0,2)}</div>
    <div>
      <div class="bubble">${text.replace(/\n/g, '<br>')}</div>
      <div class="bubble-time">${getTime()}</div>
    </div>`;
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return div;
}

function addTyping() {
  const div = document.createElement('div');
  div.className = 'message bot typing';
  div.id = 'typingIndicator';
  div.innerHTML = `
    <div class="msg-avatar">${config.botName.slice(0,2).toUpperCase()}</div>
    <div><div class="bubble"><div class="typing-dots"><span></span><span></span><span></span></div></div></div>`;
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function removeTyping() {
  const t = document.getElementById('typingIndicator');
  if (t) t.remove();
}

async function sendMessage(text) {
  if (!text.trim() || isLoading) return;
  isLoading = true;
  sendBtn.disabled = true;
  userInput.value = '';
  userInput.style.height = 'auto';

  addMessage('user', text);
  history.push({ role: 'user', content: text });
  addTyping();

  try {
    const res = await fetch('https://openrouter.ai/api/v1/chat/completions', {
      method: 'POST',
      headers: {
        'Authorization': `Bearer ${config.apiKey}`,
        'Content-Type': 'application/json',
        'HTTP-Referer': window.location.href,
        'X-Title': config.botName
      },
      body: JSON.stringify({
        model: config.model,
        messages: [
          { role: 'system', content: config.system },
          ...history
        ]
      })
    });

    const data = await res.json();

    if (!res.ok) {
      throw new Error(data.error?.message || 'API error');
    }

    const reply = data.choices[0].message.content;
    history.push({ role: 'assistant', content: reply });
    removeTyping();
    addMessage('bot', reply);

  } catch (err) {
    removeTyping();
    addMessage('bot', `Sorry, I ran into an issue: ${err.message}. Please check your API key in settings.`);
  }

  isLoading = false;
  sendBtn.disabled = false;
  userInput.focus();
}

function sendSuggestion(el) {
  sendMessage(el.textContent);
}

userInput.addEventListener('input', function() {
  this.style.height = 'auto';
  this.style.height = Math.min(this.scrollHeight, 120) + 'px';
  sendBtn.disabled = !this.value.trim() || isLoading;
});

userInput.addEventListener('keydown', function(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage(this.value);
  }
});

sendBtn.addEventListener('click', () => sendMessage(userInput.value));

// Config
document.getElementById('saveConfigBtn').addEventListener('click', () => {
  const key = document.getElementById('apiKeyInput').value.trim();
  const name = document.getElementById('botNameInput').value.trim() || 'Aria';
  const model = document.getElementById('modelInput').value;
  const system = document.getElementById('systemInput').value.trim();
  const errEl = document.getElementById('configError');

  if (!key) {
    errEl.style.display = 'block';
    errEl.textContent = 'Please enter your OpenRouter API key.';
    return;
  }

  config = { apiKey: key, botName: name, model, system };
  document.getElementById('headerBotName').textContent = name;
  document.getElementById('welcomeTitle').textContent = `Hi, I'm ${name}`;
  document.getElementById('configOverlay').style.display = 'none';
  sendBtn.disabled = false;
  userInput.focus();
});

document.getElementById('skipBtn').addEventListener('click', () => {
  config.botName = document.getElementById('botNameInput').value.trim() || 'Aria';
  config.model = document.getElementById('modelInput').value;
  config.system = document.getElementById('systemInput').value.trim();
  document.getElementById('headerBotName').textContent = config.botName;
  document.getElementById('welcomeTitle').textContent = `Hi, I'm ${config.botName}`;
  document.getElementById('configOverlay').style.display = 'none';
  addMessage('bot', "Hi! I'm running in demo mode — please add your OpenRouter API key in Settings to enable real AI responses.");
});

document.getElementById('openConfigBtn').addEventListener('click', () => {
  document.getElementById('apiKeyInput').value = config.apiKey;
  document.getElementById('botNameInput').value = config.botName;
  document.getElementById('modelInput').value = config.model;
  document.getElementById('systemInput').value = config.system;
  document.getElementById('configError').style.display = 'none';
  document.getElementById('configOverlay').style.display = 'flex';
});
</script>
</body>
</html>
